const GRIM = {
html:[
 ["Estructura semántica","<ul><li><code>header</code> / <code>footer</code>: cabecera y pie (del sitio o de una sección).</li><li><code>nav</code>: navegación principal.</li><li><code>main</code>: contenido principal y único (uno por página).</li><li><code>article</code>: contenido independiente y reutilizable (post, receta, noticia).</li><li><code>section</code>: agrupa contenido por tema.</li><li><code>aside</code>: contenido tangencial (barra lateral, publicidad).</li></ul><p>Mejora accesibilidad y SEO: los rastreadores entienden qué es cada parte.</p>"],
 ["Formularios","<ul><li><code>&lt;form action=\"/api\" method=\"POST\"&gt;</code>: action = a dónde, method = cómo.</li><li><code>&lt;label for=\"x\"&gt;</code> + <code>&lt;input id=\"x\"&gt;</code>.</li><li><code>fieldset</code> + <code>legend</code> agrupan controles.</li><li><code>required</code> impide enviar vacío. <code>button type=\"submit\"</code> envía y valida; <code>type=\"button\"</code> no envía.</li><li><code>novalidate</code> apaga los mensajes nativos (validás con <code>checkValidity()</code>).</li></ul>"],
 ["Texto, enlaces y multimedia","<ul><li><code>p</code>, <code>br</code> (vacía), <code>h1</code>–<code>h6</code>.</li><li><code>strong</code> = importancia (negrita); <code>em</code> = énfasis.</li><li><code>ol</code> numerada, <code>ul</code> con viñetas, <code>li</code> ítems.</li><li><code>a href</code> + <code>target=\"_blank\"</code> abre pestaña nueva.</li><li><code>img</code> es vacía: <code>src</code> + <code>alt</code>.</li><li><code>video</code> se cierra: <code>controls</code>, <code>autoplay</code>, <code>loop</code>, <code>preload</code>, <code>muted</code>.</li></ul>"],
 ["Tablas","<p><code>table</code> &gt; <code>thead</code> / <code>tbody</code> / <code>tfoot</code> &gt; <code>tr</code> &gt; <code>th</code> (encabezado) / <code>td</code> (dato).</p><p>Trampa: <code>head</code> y <code>header</code> no son celdas.</p>"]
],
css:[
 ["Selectores y cascada","<ul><li><code>#id</code>, <code>.clase</code>, <code>etiqueta</code>, <code>*</code> universal.</li><li>Especificidad: id &gt; clase &gt; etiqueta.</li><li>Empate de especificidad: gana la última declaración.</li><li><code>color</code> = texto; <code>background-color</code> = fondo. <code>font-color</code> y <code>text-color</code> no existen.</li></ul>"],
 ["display y visibilidad","<div class=\"tbl\"><table><tr><th>Valor</th><th>Comportamiento</th></tr><tr><td><code>block</code></td><td>Todo el ancho, empieza en línea nueva</td></tr><tr><td><code>inline</code></td><td>En línea, ignora width/height</td></tr><tr><td><code>inline-block</code></td><td>En línea y respeta width/height</td></tr><tr><td><code>none</code></td><td>Sale del flujo, no ocupa lugar</td></tr></table></div><p><code>visibility:hidden</code> oculta pero conserva el espacio.</p>"],
 ["position","<div class=\"tbl\"><table><tr><th>Valor</th><th>Referencia</th></tr><tr><td>static</td><td>Flujo normal (default)</td></tr><tr><td>relative</td><td>Su propia posición original</td></tr><tr><td>absolute</td><td>Ancestro posicionado más cercano</td></tr><tr><td>fixed</td><td>Viewport</td></tr><tr><td>sticky</td><td>relative hasta un umbral de scroll, después fixed</td></tr></table></div>"],
 ["Flexbox y responsive","<ul><li>Flexbox es unidimensional; Grid es bidimensional.</li><li><code>flex-direction</code> define el eje principal.</li><li><code>justify-content</code> → eje principal. <code>align-items</code> → eje transversal.</li><li>Con <code>column</code>, justify alinea en vertical.</li><li>Breakpoints típicos: 480 / 768 (tablet) / 1024 / 1200px.</li><li><code>prefers-reduced-motion</code>, <code>prefers-color-scheme</code>, <code>orientation</code>.</li></ul>"]
],
js:[
 ["Lenguaje","<ul><li>Brendan Eich, Netscape, 10 días (1995).</li><li>Motores: V8 (Chrome, Node), SpiderMonkey (Firefox), JavaScriptCore (Safari).</li><li>Tipado dinámico: el tipo está en el valor.</li><li><code>typeof null === \"object\"</code>; <code>3 === \"3\"</code> es false; <code>3 == \"3\"</code> es true.</li><li><code>suma(5)</code> con dos parámetros → <code>5 + undefined = NaN</code>.</li></ul>"],
 ["Funciones y clases","<ul><li>Declaración <code>function f(){}</code>: tiene hoisting completo.</li><li>Arrow sin llaves: return implícito.</li><li><code>class</code>, <code>constructor</code> (corre con <code>new</code>), <code>extends</code>, <code>super()</code>.</li><li>Clase = molde; instancia = objeto concreto.</li></ul>"],
 ["Asincronía","<ul><li>Single thread + event loop.</li><li>Promesa: pending → fulfilled | rejected.</li><li><code>fetch()</code> devuelve una Promise; el segundo <code>await res.json()</code> lee el body.</li><li>fetch solo rechaza por red: un 404 resuelve con <code>ok=false</code>.</li><li><code>await</code> pausa solo la función async.</li></ul>"],
 ["DOM","<ul><li><code>getElementById</code>, <code>querySelector</code>, <code>getElementsByClassName</code> (HTMLCollection viva).</li><li><code>addEventListener(\"submit\", e =&gt; e.preventDefault())</code>.</li><li><code>textContent</code> (texto plano) vs <code>innerHTML</code> (interpreta HTML).</li><li><code>&lt;script src=\"app.js\" defer&gt;&lt;/script&gt;</code>.</li></ul>"]
],
ts:[
 ["Uniones y estrechamiento","<ul><li>Unión discriminada: propiedad literal común (<code>forma</code>, <code>ok</code>) + switch/if.</li><li><code>const x: never = e</code> en el default fuerza cubrir todos los casos.</li><li>Type guard: <code>function f(x: unknown): x is T</code>. Con filter estrecha el array.</li><li><code>??</code> solo null/undefined; <code>||</code> cualquier falsy (0, \"\", false).</li></ul>"],
 ["Utility types","<div class=\"tbl\"><table><tr><td><code>Partial&lt;T&gt;</code></td><td>todo opcional</td></tr><tr><td><code>Omit&lt;T,K&gt;</code></td><td>saca claves</td></tr><tr><td><code>Pick&lt;T,K&gt;</code></td><td>deja solo esas</td></tr><tr><td><code>Readonly&lt;T&gt;</code></td><td>solo compilación</td></tr><tr><td><code>Record&lt;K,V&gt;</code></td><td>exactamente esas claves</td></tr></table></div><p>Para congelar en runtime: <code>Object.freeze</code>.</p>"],
 ["Genéricos y tipos derivados","<ul><li><code>function f&lt;T&gt;(x: T)</code>; <code>K extends keyof T</code>; <code>T[K]</code>.</li><li>Restricción: <code>class Repo&lt;T extends { id: number }&gt;</code>.</li><li><code>as const</code> + <code>typeof ARR[number]</code> → unión de literales.</li><li>Template literal type con uniones = producto cartesiano.</li><li>Tipos mapeados: <code>{ [K in keyof T]?: string }</code>.</li></ul>"],
 ["Runtime vs compilación","<ul><li>Enum numérico genera objeto con mapeo inverso (doble de claves). Las uniones de literales no generan JS.</li><li>Tipado estructural: sobra una prop en una variable → OK; en un literal fresco → error.</li><li>Sobrecargas: quien llama ve solo las firmas.</li><li><code>Promise.all</code> rechaza con el primer fallo; <code>allSettled</code> nunca rechaza.</li></ul>"]
],
react:[
 ["Fundamentos","<ul><li>Virtual DOM + reconciliación: solo se actualiza lo que cambió.</li><li>JSX se compila a JS (<code>React.createElement</code>). <code>className</code>, <code>htmlFor</code>.</li><li>Props para pasar datos y JSX (incluido <code>children</code>).</li><li><code>key</code> estable en listas (no el índice si se reordena).</li><li>Componente puro: mismas props → mismo resultado (<code>React.memo</code>).</li></ul>"],
 ["useState","<ul><li>Hooks solo en el nivel superior (nunca en handlers, if o loops).</li><li>El setter no cambia el valor en el render actual.</li><li>Updater: <code>setX(prev =&gt; prev + 1)</code>.</li><li>Si no desestructurás el setter, no existe.</li></ul>"],
 ["useEffect","<div class=\"tbl\"><table><tr><th>Dependencias</th><th>Corre</th></tr><tr><td>sin array</td><td>después de cada render</td></tr><tr><td><code>[]</code></td><td>una vez al montar (+ cleanup al desmontar)</td></tr><tr><td><code>[x]</code></td><td>cuando x cambia</td></tr></table></div><p>setState sin dependencias = bucle infinito. StrictMode monta dos veces en desarrollo.</p>"],
 ["Router, TS y Redux","<ul><li><code>&lt;Route path=\"/users/:userId\" element={...} /&gt;</code>, <code>useNavigate()</code>, <code>useParams&lt;{ userId: string }&gt;()</code>.</li><li><code>useState&lt;string&gt;('')</code>, <code>React.ChangeEvent&lt;HTMLInputElement&gt;</code>.</li><li>Custom hook que retorna tupla: <code>[number, () =&gt; void]</code> o <code>as const</code>.</li><li>Redux Toolkit: <code>createSlice({ name, initialState, reducers })</code>, <code>PayloadAction&lt;T&gt;</code>, selector + <code>useSelector</code>.</li></ul>"]
],

/* ---------- parser del banco ---------- */
function parseBank(txt){
  const lines = txt.replace(/<\\\//g, "</").split(/\r?\n/);
  const out = []; let zone = null, q = null, inCode = false;
  const push = () => { if (q) { out.push(q); q = null; } };
  for (const raw of lines){
    if (inCode){
      if (raw.trim() === ":C"){ inCode = false; continue; }
      q.code = q.code == null ? raw : q.code + "\n" + raw; continue;
    }
    const line = raw.trim(); if (!line) continue;
    if (line.startsWith("=== ")){ push(); zone = line.slice(4).trim(); continue; }
    const m = line.match(/^([QMFO]):\s*(.*)$/);
    if (m){ push(); q = {zone, type:m[1], q:m[2], opts:[], rows:[], items:[], x:"", t:"", pre:"", code:null}; continue; }
    if (!q) continue;
    if (line === "C:"){ inCode = true; continue; }
    if (line.startsWith("+ ")) q.opts.push({t:line.slice(2), ok:true});
    else if (line.startsWith("- ")) q.opts.push({t:line.slice(2), ok:false});
    else if (line.startsWith("R: ")) q.rows.push(line.slice(3));
    else if (line.startsWith("# ")) q.items.push(line.slice(2));
    else if (line.startsWith("X: ")) q.x = line.slice(3);
    else if (line.startsWith("T: ")) q.t = line.slice(3);
    else if (line.startsWith("P: ")) q.pre = line.slice(3);
  }
  push();
  const count = {};
  for (const it of out){ count[it.zone] = (count[it.zone] || 0) + 1; it.id = it.zone + ":" + count[it.zone]; }
  return out;
}
const BLANK = /⟦([^⟧]*)⟧/g;
function parseBlank(s){
  const opts = s.split("§"); let ans = 0;
  const clean = opts.map((o, i) => { if (o.startsWith("*")){ ans = i; return o.slice(1); } return o; });
  return {opts:clean, ans};
}

const KW = new Set("abstract async await break case catch class const constructor continue def default delete do else enum export extends false final finally for from function get if implements import in instanceof interface let new null of private protected public raise readonly return set static super switch this throw true try type typeof undefined var void while yield keyof as is never number string boolean unknown any int long double float boolean package".split(" "));
const SQL = new Set("SELECT FROM WHERE JOIN INNER LEFT ON GROUP BY ORDER HAVING UPDATE SET DELETE AND OR IN LIKE IS NOT EMPTY COUNT AVG MAX MIN SUM DESC ASC LIMIT DISTINCT PROGRAMA FINPROGRAMA DECLARAR COMO ENTERO REAL MOSTRAR POR PANTALLA INGRESAR TECLADO".split(" "));
function highlight(src){
  const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`[^`]*`)|(@[A-Za-z_][\w.]*)|(<\/?[A-Za-z][\w-]*|\/?>)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))){
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    const t = esc(m[0]);
    if (m[1]) out += `<span class="c-com">${t}</span>`;
    else if (m[2]) out += `<span class="c-str">${t}</span>`;
    else if (m[3]) out += `<span class="c-ann">${t}</span>`;
    else if (m[4]) out += `<span class="c-tag">${t}</span>`;
    else if (m[5]) out += `<span class="c-num">${t}</span>`;
    else if (KW.has(m[0]) || SQL.has(m[0])) out += `<span class="c-key">${t}</span>`;
    else out += t;
  }
  return out + esc(src.slice(last));
}

/* escena decorativa: cielo nocturno con tramado, montañas y dos torres (Frontend naranja, Backend celeste) */
let sceneStop = null;
function drawScene(cv){
  if (!cv) return null;
  const PX = 4, ctx = cv.getContext("2d");
  const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  let W = 0, H = 0, stars = [], frame = 0;
  const rnd = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sky = ["#05060f","#080b1d","#0c1230","#111a42","#172354"];
  const put = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); };
  function ridge(r, base, amp, rough){
    const h = []; let y = base;
    for (let x = 0; x < W; x++){ y += (r() - .5) * rough; y = Math.max(base - amp, Math.min(base + amp * .4, y)); h.push(Math.round(y)); }
    return h;
  }
  function tower(x0, w, hgt, lit, r){
    const top = H - hgt, body = "#05060d";
    ctx.fillStyle = body; ctx.fillRect(x0, top, w, hgt);
    for (let x = x0; x < x0 + w; x += 2) ctx.fillRect(x, top - 2, 1, 2);           // almenas
    ctx.fillRect(x0 + (w >> 1) - 1, top - 9, 2, 7);                                // mástil
    ctx.fillStyle = lit; ctx.fillRect(x0 + (w >> 1) + 1, top - 9, 4, 3);           // bandera
    for (let y = top + 4; y < H - 4; y += 4)
      for (let x = x0 + 2; x < x0 + w - 2; x += 3) if (r() > .38) { ctx.fillStyle = lit; ctx.fillRect(x, y, 1, 2); }
  }
  function paint(){
    const r = rnd(7);
    for (let y = 0; y < H; y++){
      const t = y / H * (sky.length - 1), i = Math.floor(t), f = t - i;
      for (let x = 0; x < W; x++){
        const c = f * 16 > BAYER[y & 3][x & 3] ? sky[Math.min(i + 1, sky.length - 1)] : sky[i];
        put(x, y, c);
      }
    }
    // resplandor en el horizonte: naranja a la izquierda, celeste a la derecha
    for (let y = Math.floor(H * .5); y < H; y++){
      const k = (y - H * .5) / (H * .5);
      for (let x = 0; x < W; x++){
        const side = x / W, th = k * 9;
        if (side < .42 && th * (1 - side / .42) > BAYER[y & 3][x & 3]) put(x, y, "#3a1f1a");
        if (side > .58 && th * ((side - .58) / .42) > BAYER[y & 3][x & 3]) put(x, y, "#10304a");
      }
    }
    stars = [];
    for (let n = 0; n < W * H / 90; n++){ const x = Math.floor(r() * W), y = Math.floor(r() * H * .6); stars.push([x, y, r()]); }
    // luna
    const mx = Math.floor(W * .76), my = Math.floor(H * .22), mr = Math.max(4, Math.floor(H * .07));
    for (let y = -mr; y <= mr; y++) for (let x = -mr; x <= mr; x++) if (x * x + y * y <= mr * mr) put(mx + x, my + y, (x + y) < -mr * .6 ? "#fff6d6" : "#e9dcae");
    const far = ridge(r, Math.floor(H * .62), Math.floor(H * .16), 2.2), near = ridge(r, Math.floor(H * .78), Math.floor(H * .14), 1.6);
    ctx.fillStyle = "#121a3b"; far.forEach((y, x) => ctx.fillRect(x, y, 1, H - y));
    ctx.fillStyle = "#0a0f26"; near.forEach((y, x) => ctx.fillRect(x, y, 1, H - y));
    const tw = Math.max(12, Math.floor(W * .045));
    tower(Math.floor(W * .07), tw, Math.floor(H * .5), "#ff8a3d", r);
    tower(Math.floor(W * .07) + tw + 3, Math.floor(tw * .6), Math.floor(H * .32), "#ff8a3d", r);
    tower(W - Math.floor(W * .07) - tw, tw, Math.floor(H * .56), "#38bdf8", r);
    tower(W - Math.floor(W * .07) - tw - Math.floor(tw * .6) - 3, Math.floor(tw * .6), Math.floor(H * .36), "#38bdf8", r);
    ctx.fillStyle = "#04050b"; ctx.fillRect(0, H - 2, W, 2);
    twinkle();
  }
  function twinkle(){
    frame++;
    for (const [x, y, s] of stars){
      const on = ((s * 997 + frame) | 0) % 5 !== 0;
      put(x, y, on ? (s > .85 ? "#ffffff" : "#8f9bd0") : "#1a2350");
    }
  }
  function fit(){
    const w = Math.ceil(cv.clientWidth / PX), h = Math.ceil(cv.clientHeight / PX);
    if (w === W && h === H) return; W = cv.width = w; H = cv.height = h; paint();
  }
  fit();
  const ro = new ResizeObserver(fit); ro.observe(cv);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const id = reduce ? 0 : setInterval(twinkle, 700);
  return () => { clearInterval(id); ro.disconnect(); };
}

/* ---------- cuestionario ---------- */
function prepare(q){
  const p = {q, order:null, blanks:[], items:null};
  if (q.type === "Q" || q.type === "M"){
    const tail = q.opts.filter(o => /^Ninguna/.test(o.t));
    let body = q.opts.filter(o => !/^Ninguna/.test(o.t));
    if (body.length === 2 && body.some(o => o.t === "Verdadero")) body.sort(a => (a.t === "Verdadero" ? -1 : 1));
    else body = shuffle(body);
    p.order = [...body, ...tail];
  } else if (q.type === "F"){
    const all = (q.code || "") + "\n" + q.rows.join("\n");
    for (const m of all.matchAll(BLANK)) p.blanks.push(parseBlank(m[1]));
  } else if (q.type === "O"){
    p.items = shuffle(q.items.map((t, i) => ({t, pos:i})));
  }
  return p;
}
function blankSelect(b, idx){
  const opts = shuffle(b.opts.map((o, i) => ({o, i})));
  return `<select class="blank" data-b="${idx}" id="blank-${idx}" aria-label="Espacio ${idx + 1}"><option value="">elegí…</option>${opts.map(x => `<option value="${x.i}">${esc(x.o)}</option>`).join("")}</select>`;
}
function codeWithBlanks(code, start){
  let html = "", last = 0, i = start;
  for (const m of code.matchAll(BLANK)){
    html += highlight(code.slice(last, m.index)) + `<span data-slot="${i}"></span>`; last = m.index + m[0].length; i++;
  }
  return {html:html + highlight(code.slice(last)), next:i};
}
const rightText = (q, p) => q.type === "F" ? p.blanks.map(b => b.opts[b.ans]).join(" · ")
  : q.type === "O" ? q.items.join(" → ") : q.opts.filter(o => o.ok).map(o => o.t).join(" · ");

function startQuiz(cfg){
  const S = {cfg, i:0, ok:0, bad:0, partial:0, log:[], deadline:cfg.exam ? Date.now() + cfg.minutes * 60000 : 0};
  const total = cfg.qs.length;
  const render = () => {
    const p = prepare(cfg.qs[S.i]); const q = p.q;
    let sel = new Set(), cursor = 0, answered = false;
    let body = "", stem = "";
    if (q.code != null && q.type !== "F") stem = `<pre class="code">${highlight(q.code)}</pre>`;
    if (q.type === "Q" || q.type === "M"){
      if (q.type === "M") body += `<p class="hint-line">Marcá todas las opciones correctas.</p>`;
      body += `<ul class="opts" id="opts" role="${q.type === "M" ? "group" : "radiogroup"}" ${q.type === "M" ? "data-multi" : ""}>${p.order.map((o, k) =>
        `<li><button type="button" class="opt" data-k="${k}" role="${q.type === "M" ? "checkbox" : "radio"}" aria-checked="false"><span class="box"></span><span class="key">${k + 1}</span><span class="otxt">${fmt(o.t)}</span></button></li>`).join("")}</ul>`;
    } else if (q.type === "F"){
      let idx = 0;
      body += `<p class="hint-line">Completá cada casilla desplegable.</p>`;
      if (q.code != null){
        const r = codeWithBlanks(q.code, 0); idx = r.next;
        // con filas aparte, el código va a la izquierda; si los huecos están en el código, ocupa todo
        if (q.rows.length) stem = `<pre class="code">${r.html}</pre>`; else body += `<pre class="code">${r.html}</pre>`;
      }
      if (q.rows.length){
        body += `<div class="rows">` + q.rows.map(row => {
          const m = row.match(/^(.*?)\s*⟦/); const label = m ? m[1] : row;
          const html = `<div class="rowq"><span class="rl">${fmt(label)}</span><span data-slot="${idx}"></span></div>`; idx++; return html;
        }).join("") + `</div>`;
      }
    } else if (q.type === "O"){
      body += `<p class="hint-line">Asigná la posición de cada paso.</p><ol class="order">${p.items.map((it, k) => `<li><select class="blank" data-o="${k}" id="ord-${k}" aria-label="Posición de ${esc(it.t)}"><option value="">posición…</option>${q.items.map((_, n) => `<option value="${n}">${n + 1}º</option>`).join("")}</select><span>${fmt(it.t)}</span></li>`).join("")}</ol>`;
    }
    const kind = {Q:"Opción única", M:"Opción múltiple", F:"Completar", O:"Ordenar"}[q.type];
    const tp = TOPIC[q.zone];
    setView(`
      <div class="narrow">
        <div class="qtop">
          <div class="tico">${icon(cfg.icon || tp.icon)}</div>
          <div class="ttl">${esc(cfg.title)}<small>Pregunta ${S.i + 1} de ${total}</small></div>
          <div class="tally">${cfg.exam ? `<span class="timer" id="timer" aria-label="Tiempo restante">--:--</span>` : `<span class="ok-t" aria-label="Correctas">✓ ${S.ok}</span><span class="bad-t" aria-label="Incorrectas">✗ ${S.bad}</span>`}</div>
          <div class="bar seg8" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${S.i}"><i style="--p:${S.i / total}"></i></div>
        </div>
        <section class="panel qcard ${stem ? "split" : ""}" id="qcard">
          <div class="qstem">
          <div class="qmeta"><span class="pill acc">${kind}</span><span class="pill">${esc(tp.name)}</span></div>
          ${q.pre ? `<p class="qpre">${fmt(q.pre)}</p>` : ""}
          <h2 class="qtext">${fmt(q.q)}</h2>
          ${stem}
          </div>
          <div class="qans">
          ${body}
          <div id="feedback"></div>
          <div class="qactions">
            <button class="btn btn-primary" id="confirm" type="button" disabled>Responder</button>
            <button class="btn" id="skip" type="button">${cfg.exam ? "En blanco" : "Saltear"}</button>
            <span class="spacer"></span>
            ${q.type === "Q" || q.type === "M" ? `<span class="hint"><span class="kbd">1–${p.order.length}</span> elegir · <span class="kbd">Enter</span> responder</span>` : ""}
            <button class="btn" id="quit" type="button">${cfg.exam ? "Entregar" : "Salir"}</button>
          </div>
          </div>
        </section>
      </div>`, cfg.nav || "home", {quiz:true});

    app.querySelectorAll("[data-slot]").forEach(s => { const i = +s.dataset.slot; s.outerHTML = blankSelect(p.blanks[i], i); });

    const confirmBtn = $("#confirm"), qcard = $("#qcard");
    const optEls = [...app.querySelectorAll(".opt")];
    const selects = [...app.querySelectorAll("select.blank")];
    const refreshConfirm = () => {
      if (answered) return;
      confirmBtn.disabled = optEls.length ? sel.size === 0 : selects.some(s => s.value === "");
    };
    const choose = k => {
      if (answered) return;
      if (q.type === "M"){ sel.has(k) ? sel.delete(k) : sel.add(k); } else sel = new Set([k]);
      optEls.forEach((el, n) => { el.classList.toggle("sel", sel.has(n)); el.setAttribute("aria-checked", sel.has(n)); });
      cursor = k; refreshConfirm();
    };
    optEls.forEach((el, k) => { el.onclick = () => choose(k); el.onfocus = () => { cursor = k; }; });
    selects.forEach(s => s.onchange = () => { s.classList.toggle("filled", s.value !== ""); refreshConfirm(); });

    const evaluate = () => {
      let score = 0, okAll = false, yours = "";
      if (q.type === "Q" || q.type === "M"){
        const good = new Set(p.order.map((o, k) => o.ok ? k : -1).filter(k => k >= 0));
        okAll = good.size === sel.size && [...sel].every(k => good.has(k));
        score = okAll ? 1 : 0;
        yours = [...sel].map(k => p.order[k].t).join(" · ") || "(en blanco)";
        if (!cfg.exam) optEls.forEach((el, k) => {
          const v = good.has(k) ? "is-ok" : sel.has(k) ? "is-bad" : "";
          if (v){ el.classList.add(v); el.insertAdjacentHTML("beforeend", `<span class="verdict">${v === "is-ok" ? "✓ CORRECTA" : "✗ TU RESPUESTA"}</span>`); }
        });
      } else {
        let hits = 0;
        selects.forEach(s => {
          const good = q.type === "F" ? (s.value !== "" && +s.value === p.blanks[+s.dataset.b].ans) : (s.value !== "" && +s.value === p.items[+s.dataset.o].pos);
          if (good) hits++;
          if (!cfg.exam){
            s.classList.add(good ? "ok" : "bad");
            if (!good) s.insertAdjacentHTML("afterend", `<span class="fix">→ ${esc(q.type === "F" ? p.blanks[+s.dataset.b].opts[p.blanks[+s.dataset.b].ans] : (p.items[+s.dataset.o].pos + 1) + "º")}</span>`);
          }
        });
        score = selects.length ? hits / selects.length : 0; okAll = hits === selects.length;
        yours = `${hits} de ${selects.length} ${q.type === "F" ? "casillas" : "posiciones"} bien`;
      }
      return {score, okAll, yours, right:rightText(q, p)};
    };

    const next = () => { S.i++; if (S.i >= total) results(S); else render(); };
    const answer = blank => {
      if (answered) return; answered = true;
      $("#opts")?.classList.add("locked");
      optEls.forEach(el => el.setAttribute("aria-disabled", "true"));
      selects.forEach(s => s.disabled = true);
      const r = blank ? {score:0, okAll:false, yours:"(en blanco)", right:rightText(q, p)} : evaluate();
      S.log.push({q, ...r});
      if (r.okAll) S.ok++; else { S.bad++; if (r.score > 0) S.partial++; }
      mark(q, r.okAll);
      if (cfg.exam){ next(); return; }
      if (!r.okAll){ qcard.classList.remove("shake"); void qcard.offsetWidth; qcard.classList.add("shake"); }
      const cls = r.okAll ? "ok" : r.score > 0 ? "mid" : "bad";
      const head = r.okAll ? "✓ Correcto" : r.score > 0 ? `◐ Parcialmente correcto · ${Math.round(r.score * 100)}%` : blank ? "→ Salteada" : "✗ Incorrecto";
      $("#feedback").innerHTML = `<div class="feedback ${cls}" role="status"><div class="fh">${head}</div><div class="fb">
        ${!r.okAll && (q.type === "Q" || q.type === "M") ? `<p class="ans"><b>Respuesta correcta:</b> ${fmt(r.right)}</p>` : ""}
        ${q.x ? `<p>${fmt(q.x)}</p>` : ""}
        ${q.t ? `<p class="trap"><b>OJO ·</b> ${fmt(q.t)}</p>` : ""}</div></div>`;
      confirmBtn.textContent = S.i + 1 < total ? "Siguiente" : "Ver resultado";
      confirmBtn.disabled = false; confirmBtn.onclick = next;
      $("#skip").hidden = true;
      confirmBtn.focus({preventScroll:true});
      $("#feedback").scrollIntoView({behavior:"smooth", block:"nearest"});
    };
    confirmBtn.onclick = () => answer(false);
    $("#skip").onclick = () => answer(true);
    const finishExam = () => {
      for (let k = S.i; k < total; k++){
        const qq = cfg.qs[k];
        S.log.push({q:qq, score:0, okAll:false, yours:"(sin responder)", right:rightText(qq, prepare(qq))}); S.bad++;
      }
      S.i = total; results(S);
    };
    $("#quit").onclick = () => cfg.exam ? finishExam() : (S.log.length ? results(S) : cfg.back());
    keyHandler = e => {
      const t = e.target instanceof Element ? e.target : document.body;
      const onOpt = t.classList.contains("opt");
      if (e.key === "Enter"){
        if (t.tagName === "BUTTON" && !onOpt && t !== confirmBtn) return;
        e.preventDefault();
        if (!answered && onOpt && q.type !== "M" && sel.size === 0) choose(+t.dataset.k);
        if (!confirmBtn.disabled) confirmBtn.click();
        return;
      }
      if (t.tagName === "SELECT" || answered || !optEls.length) return;
      if (/^[1-9]$/.test(e.key) && optEls[+e.key - 1]){ e.preventDefault(); choose(+e.key - 1); }
      else if (e.key === "ArrowDown" || e.key === "ArrowUp"){
        e.preventDefault(); const k = (cursor + (e.key === "ArrowDown" ? 1 : -1) + optEls.length) % optEls.length; optEls[k].focus();
      }
    };
    if (cfg.exam){
      const tick = () => {
        const left = Math.max(0, S.deadline - Date.now()); const el = $("#timer"); if (!el) return;
        el.textContent = `${String(Math.floor(left / 60000)).padStart(2, "0")}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
        el.classList.toggle("low", left < 5 * 60000);
        if (left <= 0){ clearInterval(timerId); finishExam(); }
      };
      tick(); timerId = setInterval(tick, 1000);
    }
  };
  render();
}

/* ---------- resultados ---------- */
function results(S){
  const {cfg} = S; const n = S.log.length;
  const pts = S.log.reduce((a, r) => a + r.score, 0);
  const nota = n ? pts / n * 10 : 0;
  const wrong = S.log.filter(r => !r.okAll);
  const num = v => v.toFixed(2).replace(".", ",");
  setView(`
    <div class="narrow">
      <div class="qtop"><div class="tico">${icon(cfg.icon || "layers")}</div><div class="ttl">${esc(cfg.title)}<small>Resultado</small></div><div></div><div class="bar seg8"><i style="--p:1"></i></div></div>
      <section class="panel panel-strong">
        <div class="score">
          <div><span class="eyebrow">${cfg.exam ? "Calificación" : "Correctas"}</span><div class="big">${cfg.exam ? num(nota) : `${S.ok}/${n}`}</div></div>
          <dl>
            <dt>Correctas</dt><dd>${S.ok}</dd>
            <dt>Con errores</dt><dd>${wrong.length}</dd>
            ${S.partial ? `<dt>Parciales</dt><dd>${S.partial}</dd>` : ""}
            <dt>Puntaje</dt><dd>${num(pts)} / ${n}</dd>
          </dl>
        </div>
        <p>${cfg.exam ? (nota >= 6 ? "Aprobado. Revisá abajo lo que fallaste para llegar con más margen." : "Todavía no llega a 6. Revisá abajo cada error y practicá esos temas.") : wrong.length ? "Lo que fallaste quedó en Repasar errores." : "Sin errores en esta vuelta."}</p>
        <div class="qactions" style="position:static;border:0;margin:16px 0 0;padding:0;background:none">
          <button class="btn btn-primary" id="again" type="button">${cfg.exam ? "Otro simulacro" : "Repetir"}</button>
          ${wrong.length && !cfg.exam ? `<button class="btn" id="redo" type="button">Solo las ${wrong.length} falladas</button>` : ""}
          <button class="btn" id="back" type="button">Volver a temas</button>
        </div>
      </section>
      ${wrong.length ? `<section class="panel" style="margin-top:24px">
        <div class="section-title"><h2>Para repasar</h2><span class="eyebrow">${wrong.length}</span></div>
        <ul class="review">${wrong.map(r => `<li>
          <p class="rq">${fmt(r.q.q)}</p>
          <p class="ra badc"><span>TU RESPUESTA</span><span>${fmt(r.yours)}</span></p>
          <p class="ra okc"><span>CORRECTA</span><span>${fmt(r.right)}</span></p>
          ${r.q.x ? `<p class="rx">${fmt(r.q.x)}</p>` : ""}
          ${r.q.t ? `<p class="rx"><b>Ojo:</b> ${fmt(r.q.t)}</p>` : ""}
        </li>`).join("")}</ul></section>` : ""}
    </div>`, cfg.nav || "home");
  $("#again").onclick = () => cfg.again ? cfg.again() : startQuiz({...cfg, qs:shuffle(cfg.qs)});
  if ($("#redo")) $("#redo").onclick = () => startQuiz({...cfg, qs:shuffle(wrong.map(r => r.q))});
  $("#back").onclick = () => home();
}

/* ---------- resumen teórico ---------- */
function grimorio(id){
  if (!realm) return landing();
  const list = realmTopics(realm);
  if (!id || TOPIC[id].realm !== realm) id = list[0].id;
  setView(`
    <div class="chips" role="tablist" aria-label="Temas">${list.map(t => `<button class="chip" role="tab" aria-selected="${t.id === id}" data-g="${t.id}" type="button">${icon(t.icon)}${esc(t.name)}</button>`).join("")}</div>
    <div class="section-title"><h2>${esc(TOPIC[id].name)}</h2><span class="eyebrow">Resumen</span></div>
    <div class="gcards" role="tabpanel">${(GRIM[id] || []).map(([h, b]) => `<article class="gcard"><h3>${esc(h)}</h3>${b}</article>`).join("")}</div>
    <div class="qactions" style="position:static;border:0;margin:24px 0 0;padding:0;background:none"><button class="btn btn-primary" id="g-practice" type="button">Practicar ${esc(TOPIC[id].name)}</button></div>`, "grim");
  app.querySelector(".chip[aria-selected='true']")?.scrollIntoView({block:"nearest", inline:"center"});
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => grimorio(b.dataset.g));
  $("#g-practice").onclick = () => startQuiz({title:TOPIC[id].name, icon:TOPIC[id].icon, qs:shuffle(BY_ZONE[id]), exam:false, back:() => grimorio(id)});
}

if (realm){ setRealm(realm); home(); } else landing();
})();
</script>
